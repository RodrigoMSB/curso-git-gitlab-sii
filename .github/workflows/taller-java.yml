# SPEC 026 · El modo taller con Git real, en Windows y en Mac.
#
# 1. runtimes: genera los dos runtimes con el script del repositorio, desde
#    los jmods de Temurin con sus sumas fijas. Se entregan como artefacto a
#    los demas trabajos, para probarlos antes de confirmarlos (punto 9.3).
# 2. unidad: las pruebas de Java en Windows y en Mac, y la comprobacion de que
#    el jar confirmado corresponde al codigo confirmado (punto 6.3).
# 3. arranque: el programa arrancado como lo arranca el participante, con el
#    runtime del repositorio, en Windows y en Mac, y en Windows ademas con Git
#    fuera del PATH (punto 3.3).
name: taller-java
on:
  push:
    branches: [taller-java]
  workflow_dispatch:
jobs:
  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Genera los runtimes con jlink
        run: taller-java/fuente/generar-runtimes.sh
      - name: Empaqueta conservando permisos
        run: tar czf jre.tar.gz -C taller-java jre
      - uses: actions/upload-artifact@v4
        with:
          name: jre
          path: jre.tar.gz

  unidad:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: taller-java/fuente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Versiones
        run: git --version && bash --version | head -1 && java -version
      - name: Pruebas de unidad
        run: ./mvnw -B -ntp verify
      - name: El jar confirmado corresponde al codigo
        run: |
          mkdir -p /tmp/a /tmp/b
          (cd /tmp/a && unzip -q -o "$GITHUB_WORKSPACE/taller-java/taller.jar")
          (cd /tmp/b && unzip -q -o "$GITHUB_WORKSPACE/taller-java/fuente/target/taller.jar")
          diff -r /tmp/a /tmp/b && echo "el jar confirmado es el del codigo"

  arranque:
    needs: runtimes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variante: normal
          - os: windows-latest
            variante: git-fuera-del-path
          - os: macos-latest
            variante: normal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jre
      - name: Pone el runtime en su lugar
        run: tar xzf jre.tar.gz -C taller-java && ls taller-java/jre
      - name: Por que no arranco el prototipo en Python en Mac
        if: runner.os == 'macOS'
        run: |
          python3 - <<'EOF'
          import socket, time
          t = time.time(); socket.getfqdn('127.0.0.1'); print(f'getfqdn(127.0.0.1) tardo {time.time()-t:.1f} s')
          t = time.time(); socket.getfqdn(''); print(f"getfqdn('') tardo {time.time()-t:.1f} s")
          EOF
      - name: Arranca y responde
        env:
          VARIANTE: ${{ matrix.variante }}
        run: taller-java/fuente/probar-arranque.sh

  # 4. recorrido: los ocho laboratorios escritos en la consola de la pagina,
  #    en un navegador de verdad, comparados contra Git (punto 7.2). Playwright
  #    usa el navegador que ya trae la maquina.
  recorrido:
    needs: runtimes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            navegador: msedge
            variante: normal
          - os: windows-latest
            navegador: chrome
            variante: normal
          - os: macos-latest
            navegador: chrome
            variante: normal
          - os: windows-latest
            navegador: chrome
            variante: git-fuera-del-path
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: jre
      - name: Pone el runtime en su lugar
        run: tar xzf jre.tar.gz -C taller-java
      - name: Dependencias, sin bajar navegadores
        working-directory: simulador
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Versiones
        run: git --version && node --version && bash --version | head -1
      - name: Los ocho laboratorios en la pagina
        working-directory: simulador
        run: npx vitest run --config vitest.taller-java.config.ts
        env:
          TALLER_NAVEGADOR: ${{ matrix.navegador }}
          TALLER_SIN_GIT_EN_PATH: ${{ matrix.variante == 'git-fuera-del-path' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorrido-${{ matrix.os }}-${{ matrix.navegador }}-${{ matrix.variante }}
          path: simulador/capturas-taller-java

  # 5. Un usuario de Windows de verdad, con espacio y tilde en su carpeta
  #    personal (punto 7.3). Se crea en la maquina y el recorrido corre como el.
  usuario-con-tilde:
    needs: runtimes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: jre
      - name: Pone el runtime en su lugar
        shell: bash
        run: tar xzf jre.tar.gz -C taller-java
      - name: Dependencias, sin bajar navegadores
        shell: bash
        working-directory: simulador
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: El recorrido como José Pérez
        shell: pwsh
        run: taller-java/fuente/como-usuario-con-tilde.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorrido-usuario-con-tilde
          path: C:\taller-usuario\salida
